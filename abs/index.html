<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Abs</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            background: #111;
            color: #fff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overscroll-behavior: none;
        }
        .feed {
            height: 100dvh;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .slide {
            position: relative;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }
        video {
            display: block;
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            background: #111;
        }
        .meta {
            position: absolute;
            left: 16px;
            bottom: calc(28px + env(safe-area-inset-bottom));
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 1px 8px rgba(0,0,0,.7);
        }
        .meta strong {
            display: block;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .meta span {
            display: block;
            margin-top: 4px;
            font-size: 13px;
            opacity: 0.7;
        }
        .dots {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 7px;
            pointer-events: none;
        }
        .dots i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,.35);
        }
        .dots i.on { background: #fff; }

        .timers {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            display: flex;
            gap: 8px;
        }
        .timers button {
            appearance: none;
            border: 2px solid #fff;
            background: rgba(0,0,0,.55);
            color: #fff;
            font: 700 16px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            letter-spacing: 0.02em;
        }
        .timers button.on {
            background: #fff;
            color: #111;
        }

        .count {
            position: fixed;
            left: 50%;
            top: calc(72px + env(safe-area-inset-top));
            transform: translateX(-50%);
            z-index: 5;
            pointer-events: none;
            display: none;
            font-size: clamp(120px, 38vw, 240px);
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            line-height: 0.85;
            letter-spacing: -0.07em;
            color: #fff;
            text-shadow:
                -5px -5px 0 #000, 5px -5px 0 #000,
                -5px 5px 0 #000, 5px 5px 0 #000,
                -5px 0 0 #000, 5px 0 0 #000,
                0 -5px 0 #000, 0 5px 0 #000,
                0 10px 0 #000, 0 0 28px #000;
        }
        .count.show { display: block; }
        .count.warn { color: #ffe14a; }
        .count.now {
            color: #ff2d2d;
            transform: translateX(-50%) scale(1.12);
        }
    </style>
</head>
<body>
    <div class="timers" id="timers">
        <button type="button" data-sec="20">20s</button>
        <button type="button" data-sec="30">30s</button>
    </div>
    <div class="count" id="count" aria-hidden="true">20</div>
    <div class="feed" id="feed">
        <section class="slide" data-i="0">
            <video src="clips/01.mp4" muted loop playsinline preload="auto"></video>
            <div class="meta"><strong>Seated knee tucks</strong><span>1 / 8</span></div>
        </section>
        <section class="slide" data-i="1">
            <video src="clips/02.mp4" muted loop playsinline preload="metadata"></video>
            <div class="meta"><strong>Flutter kicks</strong><span>2 / 8</span></div>
        </section>
        <section class="slide" data-i="2">
            <video src="clips/03.mp4" muted loop playsinline preload="metadata"></video>
            <div class="meta"><strong>Dead bug</strong><span>3 / 8</span></div>
        </section>
        <section class="slide" data-i="3">
            <video src="clips/04.mp4" muted loop playsinline preload="metadata"></video>
            <div class="meta"><strong>Sit-ups</strong><span>4 / 8</span></div>
        </section>
        <section class="slide" data-i="4">
            <video src="clips/05.mp4" muted loop playsinline preload="metadata"></video>
            <div class="meta"><strong>Bicycle crunches</strong><span>5 / 8</span></div>
        </section>
        <section class="slide" data-i="5">
            <video src="clips/06.mp4" muted loop playsinline preload="metadata"></video>
            <div class="meta"><strong>Reverse crunches</strong><span>6 / 8</span></div>
        </section>
        <section class="slide" data-i="6">
            <video src="clips/07.mp4" muted loop playsinline preload="metadata"></video>
            <div class="meta"><strong>Forearm plank</strong><span>7 / 8</span></div>
        </section>
        <section class="slide" data-i="7">
            <video src="clips/08.mp4" muted loop playsinline preload="metadata"></video>
            <div class="meta"><strong>Mountain climbers</strong><span>8 / 8</span></div>
        </section>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <script>
        const slides = [...document.querySelectorAll('.slide')];
        const dots = document.getElementById('dots');
        const countEl = document.getElementById('count');
        const timerBtns = [...document.querySelectorAll('#timers button')];

        slides.forEach((_, i) => {
            const el = document.createElement('i');
            if (i === 0) el.className = 'on';
            dots.appendChild(el);
        });
        const dotEls = [...dots.children];

        let active = -1;
        let duration = 0;
        let remaining = 0;
        let lastTs = 0;
        let ticking = false;

        function currentVideo() {
            return slides[Math.max(active, 0)].querySelector('video');
        }

        function renderCount() {
            if (!duration) {
                countEl.className = 'count';
                return;
            }
            const n = Math.max(0, Math.ceil(remaining));
            countEl.textContent = String(n);
            countEl.className = 'count show' + (n <= 3 ? ' now' : n <= 5 ? ' warn' : '');
        }

        function setDuration(sec) {
            duration = sec;
            remaining = sec;
            lastTs = 0;
            timerBtns.forEach((b) => b.classList.toggle('on', Number(b.dataset.sec) === sec));
            renderCount();
            if (sec && !ticking) {
                ticking = true;
                requestAnimationFrame(tick);
            }
            if (sec) currentVideo().play().catch(() => {});
        }

        function setActive(i) {
            if (i === active) return;
            slides.forEach((slide, n) => {
                const v = slide.querySelector('video');
                if (n === i) {
                    v.play().catch(() => {});
                } else {
                    v.pause();
                    v.currentTime = 0;
                }
            });
            dotEls.forEach((d, n) => d.classList.toggle('on', n === i));
            active = i;
            if (duration) {
                remaining = duration;
                lastTs = 0;
                renderCount();
            }
        }

        function goNext() {
            const next = (active + 1) % slides.length;
            setActive(next);
            slides[next].scrollIntoView({ behavior: 'auto' });
        }

        function tick(ts) {
            if (!duration) {
                ticking = false;
                lastTs = 0;
                renderCount();
                return;
            }
            ticking = true;
            if (!lastTs) lastTs = ts;
            const dt = (ts - lastTs) / 1000;
            lastTs = ts;
            const v = currentVideo();
            if (!v.paused) {
                remaining -= dt;
                if (remaining <= 0) {
                    remaining = duration;
                    goNext();
                }
            }
            renderCount();
            requestAnimationFrame(tick);
        }

        const io = new IntersectionObserver((entries) => {
            entries.forEach((e) => {
                if (e.isIntersecting && e.intersectionRatio >= 0.6) {
                    setActive(Number(e.target.dataset.i));
                }
            });
        }, { threshold: [0.6] });

        slides.forEach((s) => io.observe(s));
        setActive(0);

        timerBtns.forEach((b) => {
            b.addEventListener('click', (e) => {
                e.stopPropagation();
                const sec = Number(b.dataset.sec);
                setDuration(duration === sec ? 0 : sec);
            });
        });

        slides.forEach((slide) => {
            const v = slide.querySelector('video');
            slide.addEventListener('click', () => {
                if (v.paused) v.play();
                else v.pause();
            });
        });

        document.addEventListener('keydown', (e) => {
            const i = Math.max(active, 0);
            if (e.key === 'ArrowDown' || e.key === 'j') {
                e.preventDefault();
                slides[Math.min(i + 1, slides.length - 1)].scrollIntoView({ behavior: 'smooth' });
            }
            if (e.key === 'ArrowUp' || e.key === 'k') {
                e.preventDefault();
                slides[Math.max(i - 1, 0)].scrollIntoView({ behavior: 'smooth' });
            }
            if (e.key === ' ') {
                e.preventDefault();
                const v = slides[i].querySelector('video');
                if (v.paused) v.play();
                else v.pause();
            }
            if (e.key === '2') setDuration(duration === 20 ? 0 : 20);
            if (e.key === '3') setDuration(duration === 30 ? 0 : 30);
            if (e.key === '0' || e.key === 'Escape') setDuration(0);
        });
    </script>
</body>
</html>
